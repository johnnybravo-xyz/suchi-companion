name: suchi_companion
description: Suchi Companion, a camera-first mobile client for a self-hosted Suchi archive.
publish_to: none
version: 0.3.0+3

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.2
  crypto: 3.0.8
  drift: 2.35.4
  drift_flutter: 0.3.1
  flutter_secure_storage: 10.3.1
  http: 1.6.0
  intl: 0.20.3
  path: 1.9.1
  path_provider: 2.1.6
  package_info_plus: 10.2.2
  pdf: 3.13.1
  url_launcher: 6.3.3
  uuid: 4.6.0
  webview_flutter: 4.14.1
  http_parser: 4.1.2
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.17.1
  drift_dev: 2.35.3
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  webview_flutter_platform_interface: 2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/suchi-tile.png
    - assets/fonts/schibsted-grotesk/OFL.txt
    - assets/fonts/spline-sans-mono/OFL.txt
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/schibsted-grotesk/SchibstedGrotesk[wght].ttf
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/spline-sans-mono/SplineSansMono[wght].ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/suchi-mark.png
  image_path_android: assets/brand/suchi-mark-android.png
  adaptive_icon_background: '#FAFAF8'
  adaptive_icon_foreground: assets/brand/suchi-mark-android.png
  adaptive_icon_foreground_inset: 20
  adaptive_icon_monochrome: assets/brand/suchi-mark-android-monochrome.png
  background_color_ios: '#FAFAF8'
  remove_alpha_ios: true
  min_sdk_android: 31
