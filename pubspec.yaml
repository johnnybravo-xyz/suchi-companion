name: suchi_mobile
description: Suchi Companion, a camera-first mobile client for a self-hosted Suchi archive.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  drift: 2.34.3
  drift_flutter: 0.3.1
  flutter_secure_storage: 10.3.1
  http: 1.6.0
  intl: 0.20.3
  path: 1.9.1
  path_provider: 2.1.6
  pdf: 3.13.0
  url_launcher: 6.3.2
  uuid: 4.6.0
  webview_flutter: 4.14.0
  http_parser: 4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.1
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  webview_flutter_platform_interface: 2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/suchi-tile.png
  fonts:
    - family: Schibsted Grotesk
      fonts:
        - asset: assets/fonts/schibsted-grotesk/SchibstedGrotesk[wght].ttf
    - family: Spline Sans Mono
      fonts:
        - asset: assets/fonts/spline-sans-mono/SplineSansMono[wght].ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/suchi-tile.png
  adaptive_icon_background: '#FAFAF8'
  adaptive_icon_foreground: assets/brand/suchi-tile.png
  adaptive_icon_foreground_inset: 20
  background_color_ios: '#FAFAF8'
  remove_alpha_ios: true
  min_sdk_android: 26
