# SPDX-License-Identifier: AGPL-3.0-or-later
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: metadata
        name: Read compatible server revision
        run: |
          ref=$(python3 -c 'import json; print(json.load(open("tool/toolchain.json"))["server"]["compatible_ref"])')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: johnnybravo-xyz/suchi
          ref: ${{ steps.metadata.outputs.ref }}
          path: suchi-server
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Verify source and API contract
        run: |
          make deps
          make api-check SERVER_ROOT="$GITHUB_WORKSPACE/suchi-server"
          make check
      - name: Build and lint Android debug application
        run: |
          make android
          ./android/gradlew --no-daemon -p android :app:lintDebug :app:testDebugUnitTest

  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Verify pinned Apple toolchain
        run: |
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.0"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 27A266a"
          case "$(swift --version)" in
            *"Apple Swift version 6.4 "*) ;;
            *) swift --version; exit 1 ;;
          esac
          flutter_root=$(dirname "$(dirname "$(command -v flutter)")")
          echo "FLUTTER_ROOT=$flutter_root" >> "$GITHUB_ENV"
      - name: Build isolated iOS simulator application
        run: |
          make deps
          make ios
          make ios-canary
